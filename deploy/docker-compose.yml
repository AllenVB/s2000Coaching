# Production stack: PostgreSQL, the backend, and the web server (static site + HTTPS + /api).
#
#   cp deploy/.env.example deploy/.env      # then fill it in
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Only the web server is reachable from outside (ports 80 and 443). The database and the
# backend have no published ports: they talk to each other on the stack's private network.
name: s2000

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: s2000coaching
      POSTGRES_USER: s2000coaching
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U s2000coaching -d s2000coaching']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/s2000coaching
      DB_USERNAME: s2000coaching
      DB_PASSWORD: ${DB_PASSWORD}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL is not set in deploy/.env}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Istanbul}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is not set in deploy/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Koç}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST is not set in deploy/.env (members sign in with an e-mailed code)}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is not set in deploy/.env}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_SSL: ${MAIL_SSL:-false}
      PAYMENT_IBAN: ${PAYMENT_IBAN:-}
      PAYMENT_IBAN_HOLDER: ${PAYMENT_IBAN_HOLDER:-}
      PAYMENT_IBAN_BANK: ${PAYMENT_IBAN_BANK:-}
      PAYMENT_IYZICO_API_KEY: ${PAYMENT_IYZICO_API_KEY:-}
      PAYMENT_IYZICO_SECRET_KEY: ${PAYMENT_IYZICO_SECRET_KEY:-}
      PAYMENT_IYZICO_BASE_URL: ${PAYMENT_IYZICO_BASE_URL:-https://sandbox-api.iyzipay.com}
      PAYMENT_IYZICO_CALLBACK_URL: ${PAYMENT_IYZICO_CALLBACK_URL:-}
    volumes:
      - photos:/data/photos
    # No curl in the image, so this opens the port the way a client would.
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/7001"']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *logging

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_APP_TIME_ZONE: ${APP_TIME_ZONE:-Europe/Istanbul}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is not set in deploy/.env}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      # Certificates: losing these means asking for new ones, and the issuer limits how often.
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  pgdata:
  photos:
  caddy_data:
  caddy_config:
