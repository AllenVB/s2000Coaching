spring:
  application:
    name: backend
  servlet:
    multipart:
      # Must stay at or above app.photos.max-size-bytes. Below it, the container rejects the
      # upload before the service runs, so the member sees a generic 500 instead of the size
      # message — and raising the app limit alone would silently change nothing.
      max-file-size: ${PHOTO_MAX_SIZE_BYTES:8388608}
      max-request-size: ${PHOTO_MAX_REQUEST_SIZE_BYTES:10485760}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:10003/s2000coaching}
    username: ${DB_USERNAME:s2000coaching}
    password: ${DB_PASSWORD:s2000coaching}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # Leave MAIL_HOST unset and verification codes are written to the log instead of being
  # mailed, which is what a development machine wants. Set it and MailConfig switches to
  # the SMTP sender; the provider decides which of the two TLS settings below applies, so
  # both are exposed rather than guessed.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
          ssl:
            enable: ${MAIL_SSL:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${SERVER_PORT:10002}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:10001}
  admin:
    # The first coach account is created from these on an empty database; an existing
    # account is never overwritten. Leave them unset and the management area has no way in.
    seed-email: ${ADMIN_EMAIL:}
    seed-password: ${ADMIN_PASSWORD:}
    seed-name: ${ADMIN_NAME:Koç}
    session-ttl: ${ADMIN_SESSION_TTL:12h}
    lockout-duration: ${ADMIN_LOCKOUT_DURATION:15m}
  verification:
    code-ttl: ${VERIFICATION_CODE_TTL:15m}
    # Anyone who knows a member's address can ask for a code, so the limits are per member:
    # a wait between codes, and a ceiling per hour. Both count codes already issued, the
    # coach's "resend" included.
    resend-cooldown: ${VERIFICATION_RESEND_COOLDOWN:60s}
    hourly-limit: ${VERIFICATION_HOURLY_LIMIT:5}
  member-session:
    ttl: ${MEMBER_SESSION_TTL:14d}
  cleanup:
    # Nightly at 03:30. Codes are kept past their 15-minute life because the verification
    # rate limit counts rows from the last hour; anything under two hours is refused.
    cron: ${CLEANUP_CRON:0 30 3 * * *}
    code-retention: ${CLEANUP_CODE_RETENTION:7d}
  photos:
    # Only the key lives in the database; the bytes live here. A deployment on more than one
    # machine needs a shared volume or an object-storage PhotoStorage implementation.
    storage-path: ${PHOTO_STORAGE_PATH:./data/photos}
    max-size-bytes: ${PHOTO_MAX_SIZE_BYTES:8388608}
    max-per-member: ${PHOTO_MAX_PER_MEMBER:60}
  mail:
    from: ${MAIL_FROM:no-reply@s2000coaching.com}
