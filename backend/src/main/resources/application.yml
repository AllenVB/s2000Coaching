spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/s2000coaching}
    username: ${DB_USERNAME:s2000coaching}
    password: ${DB_PASSWORD:s2000coaching}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    # The first coach account is created from these on an empty database; an existing
    # account is never overwritten. Leave them unset and the management area has no way in.
    seed-email: ${ADMIN_EMAIL:}
    seed-password: ${ADMIN_PASSWORD:}
    seed-name: ${ADMIN_NAME:Koç}
    session-ttl: ${ADMIN_SESSION_TTL:12h}
    lockout-duration: ${ADMIN_LOCKOUT_DURATION:15m}
  verification:
    code-ttl: ${VERIFICATION_CODE_TTL:15m}
  member-session:
    ttl: ${MEMBER_SESSION_TTL:14d}
  mail:
    from: ${MAIL_FROM:no-reply@s2000coaching.com}
