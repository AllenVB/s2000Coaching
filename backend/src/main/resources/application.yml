spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/s2000coaching}
    username: ${DB_USERNAME:s2000coaching}
    password: ${DB_PASSWORD:s2000coaching}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  experience:
    # Shared passphrase required to edit "Tecrübelerim" content. Override with a real
    # secret via EXPERIENCE_EDIT_TOKEN in any non-local environment — this default is
    # for local development only and is logged as a warning on startup if left unset.
    edit-token: ${EXPERIENCE_EDIT_TOKEN:s2000-dev-edit}
