databaseChangeLog:
  - changeSet:
      id: 058-reprice-packages-three-tiers
      author: s2000
      comment: >-
        Both categories now sell three tiers, 1, 3 and 6 months. Coaching: 2.990 / 7.490 / 12.490 TL, with
        the 3-month tier highlighted. Nutrition: 1.290 / 2.690 / 4.590 TL, with the 6-month tier highlighted.
        The 12-month packages are switched off, not deleted, because orders already refer to them. There is
        no struck-through "old" price: the original price equals the price, which the page reads as no
        discount.
      changes:
        # --- coaching ---
        - insert:
            tableName: coaching_package
            columns:
              - column: { name: id, value: "11111111-1111-4111-8111-111111111108" }
              - column: { name: slug, value: "kocluk-1-ay" }
              - column: { name: category, value: "KOCLUK" }
              - column: { name: name, value: "1 Aylık Koçluk" }
              - column: { name: tagline, value: "Koçluğu denemek ve ilk programı almak için kısa ve net bir başlangıç." }
              - column: { name: duration_months, value: 1 }
              - column: { name: price_minor, value: 299000 }
              - column: { name: original_price_minor, value: 299000 }
              - column: { name: badge, value: "1 AY SÜRE" }
              - column: { name: featured, valueBoolean: false }
              - column: { name: display_order, value: 1 }
              - column: { name: active, valueBoolean: true }
        - insert: { tableName: coaching_package_feature, columns: [ { column: { name: id, value: "22222222-2222-4222-8222-222222220028" } }, { column: { name: package_id, value: "11111111-1111-4111-8111-111111111108" } }, { column: { name: label, value: "Kişiye özel antrenman programı" } }, { column: { name: display_order, value: 1 } } ] }
        - insert: { tableName: coaching_package_feature, columns: [ { column: { name: id, value: "22222222-2222-4222-8222-222222220029" } }, { column: { name: package_id, value: "11111111-1111-4111-8111-111111111108" } }, { column: { name: label, value: "Gramajlı kalori ve makro beslenme planı" } }, { column: { name: display_order, value: 2 } } ] }
        - insert: { tableName: coaching_package_feature, columns: [ { column: { name: id, value: "22222222-2222-4222-8222-222222220030" } }, { column: { name: package_id, value: "11111111-1111-4111-8111-111111111108" } }, { column: { name: label, value: "Haftalık kilo ve form değerlendirmesi" } }, { column: { name: display_order, value: 3 } } ] }
        - insert: { tableName: coaching_package_feature, columns: [ { column: { name: id, value: "22222222-2222-4222-8222-222222220031" } }, { column: { name: package_id, value: "11111111-1111-4111-8111-111111111108" } }, { column: { name: label, value: "Mesaj desteği" } }, { column: { name: display_order, value: 4 } } ] }
        - update:
            tableName: coaching_package
            columns:
              - column: { name: price_minor, valueNumeric: 749000 }
              - column: { name: original_price_minor, valueNumeric: 749000 }
              - column: { name: badge, value: "EN ÇOK TERCİH EDİLEN" }
              - column: { name: featured, valueBoolean: true }
              - column: { name: display_order, valueNumeric: 2 }
            where: "id = '11111111-1111-4111-8111-111111111101'"
        - update:
            tableName: coaching_package
            columns:
              - column: { name: price_minor, valueNumeric: 1249000 }
              - column: { name: original_price_minor, valueNumeric: 1249000 }
              - column: { name: badge, value: "6 AY SÜRE" }
              - column: { name: featured, valueBoolean: false }
              - column: { name: display_order, valueNumeric: 3 }
            where: "id = '11111111-1111-4111-8111-111111111102'"
        - update:
            tableName: coaching_package
            columns:
              - column: { name: active, valueBoolean: false }
              - column: { name: featured, valueBoolean: false }
            where: "id = '11111111-1111-4111-8111-111111111103'"
        # --- nutrition ---
        - update:
            tableName: coaching_package
            columns:
              - column: { name: price_minor, valueNumeric: 129000 }
              - column: { name: original_price_minor, valueNumeric: 129000 }
              - column: { name: badge, value: "1 AY SÜRE" }
              - column: { name: featured, valueBoolean: false }
              - column: { name: display_order, valueNumeric: 1 }
            where: "id = '11111111-1111-4111-8111-111111111104'"
        - update:
            tableName: coaching_package
            columns:
              - column: { name: price_minor, valueNumeric: 269000 }
              - column: { name: original_price_minor, valueNumeric: 269000 }
              - column: { name: badge, value: "3 AY SÜRE" }
              - column: { name: featured, valueBoolean: false }
              - column: { name: display_order, valueNumeric: 2 }
            where: "id = '11111111-1111-4111-8111-111111111105'"
        - update:
            tableName: coaching_package
            columns:
              - column: { name: price_minor, valueNumeric: 459000 }
              - column: { name: original_price_minor, valueNumeric: 459000 }
              - column: { name: badge, value: "EN ÇOK TERCİH EDİLEN" }
              - column: { name: featured, valueBoolean: true }
              - column: { name: display_order, valueNumeric: 3 }
            where: "id = '11111111-1111-4111-8111-111111111106'"
        - update:
            tableName: coaching_package
            columns:
              - column: { name: active, valueBoolean: false }
              - column: { name: featured, valueBoolean: false }
            where: "id = '11111111-1111-4111-8111-111111111107'"
