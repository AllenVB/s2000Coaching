databaseChangeLog:
  - changeSet:
      id: 007-fix-nutrition-12-month-price-overlapping-6-month-coaching-tier
      author: s2000coaching
      comment: >
        003-reprice-nutrition-packages.yaml priced 12-month nutrition-only at 690000 (₺6.900),
        exactly matching the unchanged 6-month coaching price (id ...102, training + nutrition
        together) — the opposite of "nutrition-only reads as a clearly cheaper tier". Move it
        below that anchor instead.
      changes:
        - update:
            tableName: coaching_package
            columns:
              - column: { name: price_minor, value: 649000 }
            where: "id = '11111111-1111-4111-8111-111111111107'"
